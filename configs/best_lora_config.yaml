选出最优参数组合
对比三组实验的关键指标：
实验	            rank	lr	  epochs	最终loss	训练时长	评价
exp1_baseline	    8	    2e-4	3	      ?	        ?	      基线
exp2_rank16	      16	  2e-4	3	      ?	        ?	      与exp1对比rank的影响
exp3_lr5e5_epoch5	8	    5e-5	5	      ?	        ?	      与exp1对比lr+epoch的影响

判断标准：
现象	结论
loss 最低且训练时间可接受	该参数组合是最优选择
loss 接近但训练时间短很多	优先选训练快的（性价比更高）
loss 反而更高	该参数改动方向错误，保持原参数
两个实验 loss 几乎一样	选择rank小的（适配器更小，加载更快）

更新最优配置
选定最优参数后，将对应的参数组合记录为“最优训练配置”，保存为 best_lora_config.yaml，供后续所有微调任务使用。
