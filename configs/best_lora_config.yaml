忘记某次训练用了什么参数，翻 YAML 文件找	所有参数自动记录，搜索即可
无法向别人展示“我为什么选这组参数”	截图 MLflow 对比图，面试时直接展示实验管理能力
MLflow 的真正用途就在这里——不是记录单次训练（all_results.json 做得更好），而是对比多次训练。

