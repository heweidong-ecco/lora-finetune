# /root/autodl-fs/LLaMA-Factory/best_lora_config.yaml
# 最优LoRA微调配置（基于500条alpaca-cleaned数据验证）
# best_lora_config.yaml
# 已验证最优，后续所有微调任务直接使用
适用条件：500条数据、8B模型、单卡24GB显存。如果数据量发生数量级变化，需要重新验证。
# 基础参数
lora_rank: 8
lora_alpha: 16
learning_rate: 2.0e-4
num_train_epochs: 3
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true

# 早停与评估
load_best_model_at_end: true
metric_for_best_model: loss
greater_is_better: false
eval_strategy: steps
eval_steps: 25

# 检查点保存
save_steps: 50
save_total_limit: 5
logging_steps: 10
plot_loss: true
report_to: mlflow

