### 模型配置
model_name_or_path: /root/autodl-fs/vllm-models/Qwen3-8B/models/Qwen--Qwen3-8B/snapshots/master

### 训练方法
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_alpha: 16
lora_target: all
lora_dropout: 0.05

### 数据集
dataset: my_dataset
template: qwen
cutoff_len: 1024
max_samples: 500

### 输出目录
output_dir: /root/autodl-fs/LLaMA-Factory/saves/exp1_baseline

### 训练参数
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
learning_rate: 2.0e-4
num_train_epochs: 3
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000

### 日志与保存
logging_steps: 10
save_steps: 100
save_total_limit: 2
plot_loss: true
report_to: mlflow


