version: '3.8'

services:
  # ==================== FastAPI 网关 ====================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llm-gateway
    ports:
      - "8000:8000"
    environment:
      - API_KEY=${API_KEY:?API_KEY 未设置}
      - REDIS_HOST=redis
      - OLLAMA_HOST=ollama
      - VLLM_HOST=vllm
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
      vllm:
        condition: service_started
    restart: unless-stopped

  # ==================== Redis 缓存 ====================
  redis:
    image: redis:7-alpine
    container_name: llm-redis
    ports:
      - "6379:6379"
    volumes:
      - /root/autodl-fs/redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # ==================== Ollama 推理服务 ====================
  ollama:
    image: ollama/ollama:latest
    container_name: llm-ollama
    ports:
      - "11434:11434"
    volumes:
      - /root/autodl-fs/ollama-models:/root/.ollama
    restart: unless-stopped
    command: ["serve"]

  # ==================== vLLM 推理服务 ====================
  vllm:
    image: vllm/vllm-openai:latest
    container_name: llm-vllm
    ports:
      - "8001:8001"
    volumes:
      - /root/autodl-fs/vllm-models:/models
    command: >
      --model /models/qwen2.5-7b-instruct
      --served-model-name my-local-model
      --host 0.0.0.0
      --port 8001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped